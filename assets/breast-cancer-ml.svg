<text x="130" y="105" fill="#e9f1f5" font-family="Manrope,Arial,sans-serif" font-size="34" font-weight="700" letter-spacing="4">BREAST CANCER TREATMENT RESPONSE</text>
<text x="130" y="150" fill="#9fb8c8" font-family="Manrope,Arial,sans-serif" font-size="22" letter-spacing="3">RELAPSE-FREE SURVIVAL (RFS): ERROR BY MODEL</text>
<text x="390" y="382" text-anchor="end" fill="#e9f1f5" font-family="Manrope,Arial,sans-serif" font-size="32" font-weight="600">XGBoost</text><rect x="420" y="330" width="550" height="78" rx="8" fill="#608daa"/><text x="952" y="382" text-anchor="end" fill="#021b2a" font-family="Manrope,Arial,sans-serif" font-size="32" font-weight="800">26.63</text><text x="390" y="492" text-anchor="end" fill="#e9f1f5" font-family="Manrope,Arial,sans-serif" font-size="32" font-weight="600">Random forest</text><rect x="420" y="440" width="552" height="78" rx="8" fill="#608daa"/><text x="954" y="492" text-anchor="end" fill="#021b2a" font-family="Manrope,Arial,sans-serif" font-size="32" font-weight="800">26.72</text><text x="390" y="602" text-anchor="end" fill="#e9f1f5" font-family="Manrope,Arial,sans-serif" font-size="32" font-weight="600">MLP</text><rect x="420" y="550" width="591" height="78" rx="8" fill="#608daa"/><text x="993" y="602" text-anchor="end" fill="#021b2a" font-family="Manrope,Arial,sans-serif" font-size="32" font-weight="800">28.59</text><text x="390" y="712" text-anchor="end" fill="#e9f1f5" font-family="Manrope,Arial,sans-serif" font-size="32" font-weight="800">KNN</text><rect x="420" y="660" width="500" height="78" rx="8" fill="#d9b09e"/><text x="902" y="712" text-anchor="end" fill="#021b2a" font-family="Manrope,Arial,sans-serif" font-size="32" font-weight="800">24.18</text>
